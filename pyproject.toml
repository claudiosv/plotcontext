[build-system]
build-backend = "uv_build"
requires      = ["uv_build>=0.12,<0.13.0"]

[project]
name = "plotcontext"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "polars>=1.0",
    "pandas>=2.0",
    "scienceplots>=2.2.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "emoji>=2.15.0",
    "json-with-comments>=1.2.10",
]

[project.optional-dependencies]
clipboard = ["clipin>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mpl>=0.19.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "plotcontext[clipboard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=plotcontext --cov-report=term-missing --cov-report=html"
mpl-baseline-path = "tests/baseline"
mpl-results-path = "tests/mpl-results"

[tool.coverage.run]
source = ["src/plotcontext"]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
