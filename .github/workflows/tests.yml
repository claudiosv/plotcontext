name: Tests

on:
  push:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: >
          uv run pytest --md-report --md-report-flavor=github
          --md-report-color=never
          --md-report-output=pytest-report/report.md

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Test results"
            cat pytest-report/report.md
            echo "## Coverage"
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            htmlcov
            pytest-report
          retention-days: 14
