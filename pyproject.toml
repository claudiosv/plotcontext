[build-system]
build-backend = "uv_build"
requires      = ["uv_build>=0.12,<0.13.0"]

[project]
dependencies = [
    "matplotlib>=3.10.8",
    "polars>=1.0",
    "pandas>=2.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "emoji>=2.15.0",
    "json-with-comments>=1.3.0",
    "pyarrow>=25.0.1",
]
description = "Scoped, chainable context managers for publication-ready Matplotlib/Seaborn plots"
name = "plotcontext"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.optional-dependencies]
clipboard = ["clipin>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mpl>=0.19.0",
    "ruff>=0.16.7",
    "ty>=0.0.81",
    "plotcontext[clipboard]",
    "pytest-html>=4.2.0",
    "pytest-clarity>=1.0.1",
    "pytest-sugar>=1.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-autorefs>=1.4.4",
    "mkdocstrings-python>=2.0.8",
    "pymdown-extensions>=12.0",
    "mkdocs-jupyter>=0.26.3",
]
docs-zensical = [
    "zensical>=0.0.62",
]

[tool.pytest]
minversion = "9.0"

# Only discover tests under ./tests.
testpaths = ["tests"]

addopts = [
    "-ra",               # Show a summary of skips, xfails, xpasses, etc.
    "--strict-config",   # Fail on invalid or unknown pytest configuration.
    "--strict-markers",  # Fail on unregistered/typoed pytest markers.
    "--cov=plotcontext", # Measure coverage for the plotcontext package.
    "--cov-branch",      # Measure branch coverage in addition to line coverage.
    # "--cov-report=term-missing:skip-covered", # Show uncovered lines; omit files at 100% coverage.
    "--cov-report=html:htmlcov", # Generate an HTML coverage report in ./htmlcov.
    "--html=pytest-report/report.html", # Generate a self-contained HTML test report.
    "--self-contained-html",     # Inline CSS/JS so the report is a single file.
    # "--mpl",                     # Enable pytest-mpl image comparison against baselines.
]

# Fail early with a clear error if these plugins are not installed.
required_plugins = ["pytest-cov", "pytest-mpl", "pytest-html"]

filterwarnings = [
    # seaborn's boxplot calls ax.bxp(vert=...) internally; the deprecation is
    # seaborn's to fix, not something plotcontext callers can control. The
    # colon in the message is escaped as "." since pytest's filter string
    # splits on literal colons.
    "ignore:vert. bool was deprecated in Matplotlib 3\\.11:matplotlib.MatplotlibDeprecationWarning",
]

# Reference images used by pytest-mpl for regression comparisons.
mpl-baseline-path = "tests/baseline"

# Store generated/current/diff images from pytest-mpl here.
mpl-results-path = "tests/mpl-results"

# Optional: generate an HTML summary of matplotlib comparison results.
# This also causes result images to be saved for passing tests.
mpl-generate-summary = "html"

# [tool.pytest.ini_options]
# testpaths = ["tests"]
# addopts = "--cov=plotcontext --cov-report=term-missing --cov-report=html --mpl-generate-summary=html"
# mpl-baseline-path = "tests/baseline"
# mpl-results-path = "tests/mpl-results"

[tool.coverage.run]
source = ["src/plotcontext"]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
