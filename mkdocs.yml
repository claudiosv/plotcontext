site_name: plotcontext
site_description: Scoped, chainable context managers for publication-ready Matplotlib/Seaborn plots.
site_url: https://claudiosv.github.io/plotcontext/
repo_url: https://github.com/claudiosv/plotcontext
repo_name: claudiosv/plotcontext
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - API Reference:
      - Overview: api/index.md
      - Plot builder: api/plot_context_builder.md
      - SinglePlotContext: api/single_plot_context.md
      - PolarsPlotContext: api/polars_plot_context.md
      - Standalone context managers: api/context_managers.md
      - ContextFigure: api/context_figure.md
      - FigureContext: api/figure_context.md
      - Font tools: api/plot_context_font_tools.md
      - Emoji tick labels: api/auto_emoji.md
      - Style presets: api/styles.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

watch:
  - src/plotcontext
  - README.md
